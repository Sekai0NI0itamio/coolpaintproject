name: zoo-trading

# The strategy zoo: 10 community-classic models raced head-to-head on
# live data, each with $20. Same 4x/day window cadence as the swarm
# (GitHub's per-job limit is 6h); gap-fill replays any missed candles.
# Cron times are UTC.
on:
  schedule:
    - cron: "5 0 * * *"
    - cron: "5 6 * * *"
    - cron: "5 12 * * *"
    - cron: "5 18 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Window length in hours (max ~5.7)"
        required: false
        default: "5.7"

permissions:
  contents: write
  actions: write   # allows the workflow to re-dispatch itself (continuity)

concurrency:
  group: zoo-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt

      - name: Install dependencies
        run: pip install -r requirements-swarm.txt

      - name: Install libomp (LightGBM on ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: Run zoo trading window
        run: |
          HOURS="${{ github.event.inputs.hours || '5.7' }}"
          python run_zoo.py --hours "$HOURS"

      - name: Commit zoo state
        run: |
          git config user.name "swarm-bot"
          git config user.email "swarm-bot@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "zoo: checkpoint $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || (git pull --rebase origin "$GITHUB_REF_NAME" && git push)
          else
            echo "no state changes to commit"
          fi

      - name: Schedule next window (self-chaining, cron-independent)
        run: |
          gh workflow run "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            -f hours="${{ github.event.inputs.hours || '5.7' }}"
        env:
          GH_TOKEN: ${{ github.token }}
