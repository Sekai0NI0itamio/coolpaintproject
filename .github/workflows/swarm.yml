name: swarm-trading

# Four ~5.75h trading windows per day (GitHub's per-job limit is 6h).
# Any missed/delayed window is automatically replayed ("gap-fill") by the
# next run, so no candle is ever lost. Cron times are UTC.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Window length in hours (max ~5.8)"
        required: false
        default: "5.75"

permissions:
  contents: write
  actions: write   # allows the workflow to re-dispatch itself (continuity)

concurrency:
  group: swarm-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt

      - name: Install dependencies
        run: pip install -r requirements-swarm.txt

      - name: Install libomp (LightGBM on ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: Run swarm trading window
        run: |
          HOURS="${{ github.event.inputs.hours || '5.75' }}"
          python run_swarm.py --hours "$HOURS" --granularity ONE_HOUR
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit swarm state
        if: ${{ always() }}   # commit state even if the trading step failed/crashed
        run: |
          git config user.name "swarm-bot"
          git config user.email "swarm-bot@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "swarm: checkpoint $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || (git pull --rebase origin "$GITHUB_REF_NAME" && git push)
          else
            echo "no state changes to commit"
          fi

      - name: Schedule next window (self-chaining, coalesced)
        run: |
          # Coalesce: if a run is already queued/in-progress, don't stack
          # another one -- the existing run covers the next window. This
          # keeps the runner queue to one window at a time.
          RUNNING=$(gh run list --workflow "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            --status in_progress --status pending --status queued \
            --json databaseId -q 'length' 2>/dev/null || echo 0)
          if [ "${RUNNING:-0}" -gt 0 ]; then
            echo "a $GITHUB_WORKFLOW run is already queued/running ($RUNNING) - not re-dispatching"
            exit 0
          fi
          gh workflow run "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            -f hours="${{ github.event.inputs.hours || '5.75' }}"
        env:
          GH_TOKEN: ${{ github.token }}
