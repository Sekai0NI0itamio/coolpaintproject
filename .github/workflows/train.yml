name: train-seeds

# Trains the swarm's seed tunings on historical data, here on GitHub
# (not on your machine). Writes state/seeds.json which the swarm clones
# its initial population from. Run manually anytime, or weekly.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to train on"
        required: false
        default: "365"
  schedule:
    - cron: "0 2 * * 0"   # Sundays 02:00 UTC

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt

      - name: Install dependencies
        run: pip install -r requirements-swarm.txt

      - name: Train seed tunings on historical data
        run: python run_train.py --days "${{ github.event.inputs.days || '365' }}"

      - name: Commit seeds + training report
        run: |
          git config user.name "swarm-bot"
          git config user.email "swarm-bot@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "train: new seed tunings $(date -u '+%Y-%m-%d')"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || (git pull --rebase origin "$GITHUB_REF_NAME" && git push)
          fi

      - name: Upload training report
        uses: actions/upload-artifact@v4
        with:
          name: train-report
          path: state/history/train-*.md
