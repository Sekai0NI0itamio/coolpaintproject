name: deep-train

# Deep Time trainer: bots evolve for hundreds of simulated years on
# multi-year real history (default 4H candles -- fewer round trips, so
# the ~1.2% fee wall shrinks). Each run trains within a ~5h budget,
# checkpoints state/deep/, commits, and re-dispatches itself so the
# batch continues across CI jobs indefinitely. Champions validated on
# the untouched gauntlet are promoted via state/champions.json, which
# the live zoo applies automatically at its next window.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Training budget in minutes (max ~320)"
        required: false
        default: "300"
      years:
        description: "Years of history per epoch"
        required: false
        default: "3"
      granularity:
        description: "FOUR_HOUR | SIX_HOUR | ONE_DAY"
        required: false
        default: "FOUR_HOUR"

permissions:
  contents: write
  actions: write   # allows the workflow to re-dispatch itself

concurrency:
  group: deep-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt

      - name: Install dependencies
        run: pip install -r requirements-swarm.txt

      - name: Install libomp (LightGBM on ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: Run deep training window
        run: |
          MINUTES="${{ github.event.inputs.minutes || '300' }}"
          YEARS="${{ github.event.inputs.years || '3' }}"
          GRAN="${{ github.event.inputs.granularity || 'FOUR_HOUR' }}"
          python run_deep_train.py --minutes "$MINUTES" --years "$YEARS" \
            --granularity "$GRAN"
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit deep state + champions
        if: ${{ always() }}   # commit the checkpoint even on a mid-run crash
        run: |
          git config user.name "train-bot"
          git config user.email "train-bot@users.noreply.github.com"
          git add state/ data/deep.db 2>/dev/null || git add state/
          if ! git diff --cached --quiet; then
            git commit -m "deep: epoch checkpoint $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || (git pull --rebase origin "$GITHUB_REF_NAME" && git push)
          else
            echo "no deep state changes to commit"
          fi

      - name: Schedule next training window (self-chaining, coalesced)
        run: |
          # Coalesce: never stack a second training run behind one that is
          # already queued/running.
          RUNNING=$(gh run list --workflow "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            --status in_progress --status pending --status queued \
            --json databaseId -q 'length' 2>/dev/null || echo 0)
          if [ "${RUNNING:-0}" -gt 0 ]; then
            echo "a $GITHUB_WORKFLOW run is already queued/running ($RUNNING) - not re-dispatching"
            exit 0
          fi
          gh workflow run "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            -f minutes="${{ github.event.inputs.minutes || '300' }}" \
            -f years="${{ github.event.inputs.years || '3' }}" \
            -f granularity="${{ github.event.inputs.granularity || 'FOUR_HOUR' }}"
        env:
          GH_TOKEN: ${{ github.token }}
