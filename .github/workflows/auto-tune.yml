name: auto-tune

# Nightly auto-tuner: walk-forward backtests a trial-capped sample of
# guard parameter variants on recent history (fees + yield ON, OOS
# scored) and writes the winners to state/guard_params.json. Guarded
# bots read that file on construction, so the zoo/swarm automatically
# pick up tuned parameters on their next run. No self-chaining.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history"
        required: false
        default: "365"
  schedule:
    - cron: "30 3 * * *"   # nightly 03:30 UTC

permissions:
  contents: write

concurrency:
  group: auto-tune
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt

      - name: Install dependencies
        run: pip install -r requirements-swarm.txt

      - name: Install libomp (LightGBM on ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: Run guard auto-tune
        run: python run_auto_tune.py --days "${{ github.event.inputs.days || '365' }}"
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit tuned params + report
        run: |
          git config user.name "train-bot"
          git config user.email "train-bot@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "tune: guard params $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || (git pull --rebase origin "$GITHUB_REF_NAME" && git push)
          else
            echo "no tuning changes to commit"
          fi

      - name: Upload tune report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tune-report
          path: state/history/auto-tune-*.md
